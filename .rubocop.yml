plugins:
  - rubocop-capybara
  - rubocop-performance
  - rubocop-rails
  - rubocop-rake
  - rubocop-rspec
  - rubocop-rspec_rails
  - rubocop-thread_safety
  - rubocop-view_component

AllCops:
  TargetRubyVersion: 4.0
  # Required by rubocop-view_component >= 0.7: its cops resolve a class to its
  # ancestors instead of matching the file path, and they raise without the
  # index. Every `class` node in the project errors otherwise.
  UseProjectIndex: true
  Exclude:
    - app/frontend/**/*
    - bin/**/*
    - coverage/**/*
    - db/schema.rb
    - db/migrate/**/*
    - log/**/*
    - node_modules/**/*
    - public/**/*
    - tmp/**/*
    - vendor/**/*
  EnabledByDefault: true

### Rails

Rails/FilePath:
  EnforcedStyle: arguments

Rails/ApplicationController:
  Enabled: false

Rails/SchemaComment:
  Enabled: false

Rails/DefaultScope:
  Enabled: false

Rails/Env:
  Enabled: false

Rails/EnvironmentVariableAccess:
  AllowReads: true

Rails/SkipsModelValidations:
  AllowedMethods:
    - insert_all!
    - upsert_all
    - touch

Rails/SaveBang:
  AllowedReceivers:
    - turbo_stream
    - cipher

### ViewComponent

ViewComponent/PreferPrivateMethods:
  Enabled: false

ViewComponent/MissingPreview:
  Enabled: false

### Bundler

Bundler/OrderedGems:
  Enabled: false

Bundler/GemVersion:
  Enabled: false

### Performance

# Disabled upstream by default, but EnabledByDefault turns it on here. The cop
# asks for bang methods (compact!, uniq!, flatten!) that return nil when they
# change nothing, so every call site needs a guard. The receiver is already a
# fresh array from map/flat_map/filter_map, so the win is one intermediate
# array - not worth the readability cost.
Performance/ChainArrayAllocation:
  Enabled: false

### Layout

Layout/CommentIndentation:
  Exclude:
    - 'spec/spec_helper.rb'

Layout/ClassStructure:
  Enabled: false

Layout/ArgumentAlignment:
  Enabled: false

Layout/LineEndStringConcatenationIndentation:
  Enabled: false

Layout/RedundantLineBreak:
  Enabled: false

Layout/SingleLineBlockChain:
  Enabled: false

Layout/EmptyLineAfterMultilineCondition:
  Enabled: false

Layout/LineLength:
  Enabled: false

Layout/FirstArgumentIndentation:
  Enabled: false

Layout/EndAlignment:
  Enabled: false

Layout/IndentationWidth:
  Enabled: false

Layout/ElseAlignment:
  Enabled: false

Layout/MultilineOperationIndentation:
  Enabled: false

Layout/FirstArrayElementIndentation:
  Enabled: false

Layout/MultilineMethodCallIndentation:
  Enabled: false

Layout/MultilineAssignmentLayout:
  Enabled: false

Layout/LineContinuationLeadingSpace:
  Enabled: false

Layout/EmptyComment:
  Enabled: false

Layout/SpaceInsideHashLiteralBraces:
  Enabled: true
  EnforcedStyle: space
  EnforcedStyleForEmptyBraces: no_space

### Metrics

Metrics/AbcSize:
  Max: 35
  Exclude:
    - 'spec/system/**'

Metrics/MethodLength:
  Max: 50

Metrics/BlockLength:
  Max: 110
  Exclude:
    # The routing DSL is one block by design - its length tracks the app's URL
    # surface, not complexity, and every new route would push it over again.
    - config/routes.rb

Metrics/ClassLength:
  Max: 150
  Exclude:
    # An MCP tool is mostly its `description` heredoc: the protocol carries no
    # documentation of its own, so everything a model needs to call the tool
    # correctly lives inside the class. Counting that prose as class length
    # measures the wrong thing.
    - 'app/lib/mcp_server/tools/*.rb'

Metrics/ModuleLength:
  Max: 110

Metrics/ParameterLists:
  Max: 6

### Style

Style/BlockComments:
  Exclude:
    - 'spec/spec_helper.rb'

Style/FrozenStringLiteralComment:
  Enabled: false

Style/Documentation:
  Enabled: false

Style/MethodCallWithArgsParentheses:
  Enabled: false

Style/MissingElse:
  Enabled: false

Style/Copyright:
  Enabled: false

Style/InlineComment:
  Enabled: false

Style/StringHashKeys:
  Enabled: false

Style/DocumentationMethod:
  Enabled: false

Style/IfUnlessModifier:
  Enabled: false

Style/IpAddresses:
  Enabled: false

Style/DisableCopsWithinSourceCodeDirective:
  Enabled: false

Style/ClassAndModuleChildren:
  Enabled: false

Style/MethodCalledOnDoEndBlock:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: single_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: single_quotes

Style/QuotedSymbols:
  EnforcedStyle: single_quotes

Style/FormatStringToken:
  Exclude:
    - config/routes.rb

Style/RequireOrder:
  Enabled: false

Style/MultilineMethodSignature:
  Enabled: false

Style/ReturnNilInPredicateMethodDefinition:
  Enabled: false

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: comma

Style/Lambda:
  EnforcedStyle: line_count_dependent

Style/EmptyMethod:
  Enabled: false

Style/ItBlockParameter:
  Enabled: false

# Lint

Lint/ConstantResolution:
  Enabled: false

Lint/NumberConversion:
  Enabled: false

# RuboCop reads Ruby, and a ViewComponent calls most of its private methods
# from the Slim template next to it. A controller reaches them through
# `helper_method`, a helper through a turbo_stream template. The cop sees none
# of that: it reported eleven methods, nine of which are in daily use. The
# other two were really dead and are gone, so nothing is hidden here.
Lint/UnusedPrivateMethod:
  Enabled: false

# RSpec

RSpec/MultipleExpectations:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/AlignLeftLetBrace:
  Enabled: false

RSpec/AlignRightLetBrace:
  Enabled: false

RSpec/NestedGroups:
  Enabled: false

RSpec/ImplicitSubject:
  Enabled: false

RSpec/VerifiedDoubles:
  Enabled: false

# Naming

Naming/VariableNumber:
  Enabled: false

# Capybara

Capybara/AmbiguousClick:
  Enabled: false
