en:
  no_rate: The data is not enough for a driving cost. The days around a trip need 100 km at least and charged energy.
  no_price: The driving cost lacks prices. A charging session in the days around a trip has no cost, because its day has no price.
  cost_reason: 'Charging and driving do not happen on the same day. Each day therefore has a rate of its own: the charging cost of the %{days} days before and after it, divided by their distance.'
  consumption_reason: 'Charging and driving do not happen on the same day. Each day therefore has a rate of its own: the charged energy of the %{days} days before and after it, divided by their distance.'
  charge_losses: The values include the charging losses.
  unrated: Without %{distance} that lack charging data.
  range_reason: The range on a full battery, extrapolated from the reported range and the state of charge. The value is the average of the days.
