en:
  title: 'The balance does not add up (%{percent})'
  difference: Difference
  explanation_sources: Either a consumer is missing from the measurement, or a source measures too high. Consumption, autarky and savings are not reliable.
  explanation_sinks: Either a consumer is recorded too high, or a source is missing from the measurement. Consumption, autarky and savings are not reliable.
  explanation_sinks_battery: A part of this is the loss of the battery. If more is left over, a consumer is recorded too high, or a source is missing from the measurement. Consumption, autarky and savings are not reliable.
