de:
  title: Die Bilanz geht nicht auf
  difference: Differenz
  explanation_sources: Ein Sensor misst zu hoch bei der Herkunft, zu niedrig bei der Verwendung, oder er fehlt ganz.
  explanation_sinks: Ein Sensor misst zu hoch bei der Verwendung, zu niedrig bei der Herkunft, oder er fehlt ganz.
  consequence: Die errechneten Werte für Verbrauch, Autarkie und Ersparnis stimmen dann nicht.
