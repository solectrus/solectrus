    balance: 'Aufgelaufener Kontostand bis Jahresende: alle Ersparnisse und Zahlungen, ohne Zinsen.'
    npv: Wie der unverzinste Saldo, aber künftige Beträge auf heutiges Geld abgezinst (mit dem eingestellten Diskontsatz).
    degree: Anteil der Netto-Investition, der bis dahin zurückverdient ist (Amortisationsgrad).
