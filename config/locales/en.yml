    headline: Protected access
    description: This SOLECTRUS instance is not public.
    wrong: Incorrect!
    placeholder: Code word
    submit: Continue
  sponsoring:
    show:
      headline: SOLECTRUS needs you - really!
      p1: My name is Georg Ledermann and I develop SOLECTRUS full-time. Without a big company behind me, funded from my own pocket. This can't go on forever – the future of the project depends on your support.
      p2: 'As a sponsor with a monthly payment starting at €5, you not only keep development going but also get real features: <strong>Custom consumers</strong>, <strong>multiple power generators</strong>, the <strong>power splitter</strong>, the <strong>heat pump page</strong>, <strong>trends & figures</strong>, <strong>financial charts</strong>, the <strong>power balance over time</strong>, and <strong>dark mode</strong>. More is in the works.'
      p3: Sound fair?
      more: Learn more about sponsorship
      continue: Continue
      skip: Maybe later
      p4: "Don't want to subscribe just yet? No problem – the basic features remain free. This notice only pops up now and then."
      login_required: To sponsor or see more options, please log in as an administrator.
  registration_required:
    show:
      headline: Registration Required
      p1: SOLECTRUS is free to use in the basic version, but you need to register.
      p2: Registration helps to gauge how widely the software is used and to prioritize future development.
      continue: Register now
      login_required: Please log in as an administrator to complete the registration.
