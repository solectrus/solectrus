    title: MCP endpoint
    intro: 'Through this interface (MCP, Model Context Protocol), AI clients get read-only access to your SOLECTRUS data: measurements, forecasts, prices and system details.'
    url_label: 'Endpoint URL:'
    how_title: How to connect
    step_client: In your AI client (e.g. Claude, ChatGPT, or a local tool like LM Studio), add a new MCP connector using the URL above.
    step_auth: When prompted, authorize the connection with your SOLECTRUS admin password.
    step_use: The AI client can then analyze your data. Try asking whether your electricity consumption has shown any unusual anomalies lately.
