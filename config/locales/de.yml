    submit: Weiter
  sponsoring:
    show:
      headline: SOLECTRUS braucht dich - wirklich!
      p1: Mein Name ist Georg Ledermann und ich entwickle SOLECTRUS in Vollzeit. Ohne große Firma im Rücken, finanziert aus eigener Tasche. Das geht nicht ewig gut – die Zukunft des Projekts hängt also von deiner Unterstützung ab.
      p2: 'Als Sponsor ermöglichst du mit einer monatlichen Zahlung ab €5 nicht nur die Weiterentwicklung, sondern bekommst auch echte Features: <strong>Selbstdefinierte Verbraucher</strong>, <strong>mehrere Stromerzeuger</strong>, den <strong>Power-Splitter</strong>, die <strong>Wärmepumpen-Seite</strong>, <strong>Trends & Kennzahlen</strong>, <strong>Finanzdiagramme</strong>, die <strong>Strombilanz im Zeitverlauf</strong> und den <strong>Dunkelmodus</strong>. Weiteres ist in Planung.'
      p3: Klingt das fair?
      more: Mehr über das Sponsoring erfahren
      continue: Weiter
      skip: Vielleicht später
      p4: 'Falls du zunächst kein Abo abschließen möchtest: Kein Problem – die Basisfunktionen bleiben kostenlos. Dieser Hinweis taucht nur ab und zu auf.'
      login_required: Um das Sponsoring vorzunehmen oder weitere Optionen zu sehen, melde dich bitte als Admin an.
  registration_required:
    show:
      headline: Registrierung erforderlich
      p1: SOLECTRUS ist im Basisumfang kostenfrei nutzbar, erfordert jedoch eine Registrierung.
      p2: Die Registrierung hilft dabei, die Verbreitung der Software besser einzuschätzen und die Weiterentwicklung gezielt zu priorisieren.
      continue: Jetzt registrieren
      login_required: Um die Registrierung vorzunehmen, melde dich bitte als Admin an.
