# The icons this app renders, by Font Awesome style.
#
# Add an icon here by its canonical name, then run `bin/rails icons:generate`.
# That reads the path data out of the @fortawesome packages and writes
# config/icons.generated.yml, which the app renders from. An alias fails the
# task and names the canonical icon to use instead (house, not home).
#
# An icon that nothing renders any more belongs out of this list. Search for
# its name first: some are passed in as a variable, not written in the markup.

