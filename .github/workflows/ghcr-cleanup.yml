name: GHCR Cleanup

on:
  schedule:
    - cron: '0 4 * * 0'
      timezone: 'Europe/Berlin'
  workflow_dispatch:

concurrency:
  group: ghcr-cleanup-solectrus
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    permissions:
      packages: write

    steps:
      - name: Delete untagged package versions
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: solectrus
          delete-untagged: true
          delete-partial-images: true
          # Untagged digests from a CI run in flight are not garbage yet -
          # the publish job still needs them to build the manifest list.
          older-than: '1 day'
