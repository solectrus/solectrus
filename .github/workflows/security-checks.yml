name: Security checks

on:
  schedule:
    - cron: '0 4 * * *' # Daily at 4:00 AM UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruby-security:
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run Bundler Audit
        run: bin/bundler-audit check --update

  js-security:
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install JavaScript packages
        run: bun install --frozen-lockfile

      # GHSA-rj75-hqrm-r3gf: postcss-selector-parser below 7.1.6, pinned by
      # @tailwindcss/typography. It only parses our own CSS at build time.
      # Remove the ignore when the plugin moves to 7.1.6. The same ignore is
      # in config/ci.rb.
      - name: Run JavaScript security audit
        run: bun audit --ignore=GHSA-rj75-hqrm-r3gf
