name: Continuous integration

on:
  push:
    branches:
      - develop
      - 'preview-*'
      - 'hotfix/*'
    tags:
      - v*
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Lint with RuboCop
        run: bin/rubocop --parallel

      # Brakeman reads only this repository, so it belongs here. The gem and
      # package audits read an advisory database that changes on its own, and
      # a new advisory must not break a build that did not change. They run in
      # the nightly security-checks workflow instead.
      - name: Brakeman security scan
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error

      - name: Lint with ESLint
        run: bun run lint

      - name: Check for TypeScript errors
        run: bun run tsc

      - name: Lint with SlimLint
        run: bin/slim-lint .

      - name: Check formatting with bun fmt
        run: bun run format:check

      - name: Check JS size limit
        run: |
          bun vite build
          bun run size-limit

      - name: Shellcheck shell scripts
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

      # Checks the workflows themselves, and runs shellcheck on every
      # `run:` block in them.
      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  unit-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # On one runner, the unit specs took longer than every other job and
        # held up the whole run. The run step below takes the count from
        # strategy.job-total.
        group: [1, 2, 3]

    services:
      influxdb:
        image: influxdb:2.10-alpine
        ports: ['8086:8086']
        env:
          INFLUXD_HTTP_BIND_ADDRESS: ':8086'
          DOCKER_INFLUXDB_INIT_MODE: setup
          DOCKER_INFLUXDB_INIT_USERNAME: my-user
          DOCKER_INFLUXDB_INIT_PASSWORD: my-password
          DOCKER_INFLUXDB_INIT_ORG: my-org
          DOCKER_INFLUXDB_INIT_BUCKET: my-bucket
          DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-token

      postgres:
        image: postgres:19-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_PASSWORD: postgres

      # The version that HELIOS installs. The specs tagged :redis use it (see
      # spec/support/redis.rb), and bin/redis-restart.sh starts the same one.
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']

    env:
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASSWORD: postgres
      RAILS_ENV: test
      RUBY_YJIT_ENABLE: 1

      # The runner has four cores. Every worker boots Rails once before it
      # runs an example, so more workers than cores cost more than they
      # return. config/ci.rb holds the measurements behind the same limit
      # for bin/ci, which has run the unit specs this way all along.
      UNIT_WORKERS: 4

    steps:
      # Since 2026-10-13 the unit specs take up to twice as long, with the
      # same code and image. This shows the hardware behind each run.
      - name: Show runner hardware
        run: |
          nproc
          lscpu | grep -E '^(Model name|CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket|Hypervisor vendor):'
          free -m

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      # One database per worker, numbered by TEST_ENV_NUMBER.
      # config/database.yml turns that number into the database name.
      - name: Setup PostgreSQL
        run: bin/rake "parallel:create[$UNIT_WORKERS]" "parallel:load_schema[$UNIT_WORKERS]"

      - name: Build Vite assets for test
        run: bun vite build --mode test

      # Every runner restores the same log, so all of them cut the specs into
      # the same groups. coverage-report saves the log of the last run.
      - name: Restore runtime log
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/parallel_runtime_unit.log
          key: unit-runtime-${{ github.sha }}
          restore-keys: |
            unit-runtime-

      # The specs fall into one group per worker of all runners. Each runner
      # takes its own run of groups, so runner 2 of 3 with 4 workers runs
      # groups 5 to 8. parallel_tests numbers the workers of a runner from 1
      # again, so they use the databases of the step above.
      #
      # A few request specs take most of the time. A split by file size put
      # them together, and the workers of one runner ended far apart. Unlike
      # bin/ci (see config/ci.rb), the runners split by runtime. The first
      # run without a log splits by file size.
      - name: Run Unit tests with RSpec (group ${{ matrix.group }}/${{ strategy.job-total }}, ${{ env.UNIT_WORKERS }} processes)
        run: |
          if [ -s tmp/parallel_runtime_unit.log ]; then
            group_by=runtime
          else
            group_by=filesize
          fi
          first=$(( (GROUP - 1) * UNIT_WORKERS + 1 ))
          last=$(( GROUP * UNIT_WORKERS ))
          bundle exec parallel_rspec -n $(( GROUPS_TOTAL * UNIT_WORKERS )) \
            --only-group "$(seq -s, "$first" "$last")" \
            --group-by "$group_by" \
            --runtime-log tmp/parallel_runtime_unit.log \
            --serialize-stdout --combine-stderr \
            --exclude-pattern "spec/system/" \
            -o '--format progress --format ParallelTests::RSpec::RuntimeLogger --out tmp/parallel_runtime_unit.log' \
            spec
        env:
          GROUP: ${{ matrix.group }}
          GROUPS_TOTAL: ${{ strategy.job-total }}
          SKIP_VITE_BUILD: 1
          COVERAGE_NAME: unit-${{ matrix.group }}

      # Coverage and runtime log travel in one artifact, as for the system
      # specs below
      - name: Upload coverage and runtime log
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-unit-${{ matrix.group }}
          include-hidden-files: true
          path: |
            coverage/
            tmp/parallel_runtime_unit.log
          retention-days: 1

  system-test:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The one place that sets how many runners share the system specs.
        # The run step below takes the count from strategy.job-total.
        #
        # Each runner pays its setup again, so one more runner saves less
        # than its share. parallel_tests never splits a single file, so the
        # longest file is the least that one runner takes.
        group: [1, 2, 3, 4, 5, 6]

    services:
      influxdb:
        image: influxdb:2.10-alpine
        ports: ['8086:8086']
        env:
          INFLUXD_HTTP_BIND_ADDRESS: ':8086'
          DOCKER_INFLUXDB_INIT_MODE: setup
          DOCKER_INFLUXDB_INIT_USERNAME: my-user
          DOCKER_INFLUXDB_INIT_PASSWORD: my-password
          DOCKER_INFLUXDB_INIT_ORG: my-org
          DOCKER_INFLUXDB_INIT_BUCKET: my-bucket
          DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-token

      postgres:
        image: postgres:19-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_PASSWORD: postgres

    env:
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASSWORD: postgres
      RAILS_ENV: test
      RUBY_YJIT_ENABLE: 1
      # Save the page HTML next to the screenshot of a failed system test
      RAILS_SYSTEM_TESTING_SCREENSHOT_HTML: 1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(bun -e "console.log(require('./node_modules/playwright/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --only-shell chromium

      - name: Restore runtime log
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/parallel_runtime_rspec.log
          key: parallel-runtime-${{ github.sha }}
          restore-keys: |
            parallel-runtime-

      - name: Setup PostgreSQL
        run: bin/rails db:create db:schema:load

      - name: Build Vite assets for test
        run: bun vite build --mode test

      - name: Run System tests with RSpec (group ${{ matrix.group }}/${{ strategy.job-total }})
        run: |
          if [ -s tmp/parallel_runtime_rspec.log ]; then
            GROUP_BY=runtime
          else
            GROUP_BY=filesize
          fi
          bundle exec parallel_test spec/system \
            --type rspec \
            --group-by $GROUP_BY \
            --runtime-log tmp/parallel_runtime_rspec.log \
            --only-group ${{ matrix.group }} \
            -n ${{ strategy.job-total }} \
            -o '--format progress --format ParallelTests::RSpec::RuntimeLogger --out tmp/parallel_runtime_rspec.log'
        env:
          SKIP_VITE_BUILD: 1
          COVERAGE_NAME: system-${{ matrix.group }}

      # Coverage and runtime log travel in one artifact. Two paths make the
      # repository root the archive root, so the files land under coverage/
      # and tmp/ inside it. if-no-files-found stays at the default: it only
      # fires when BOTH paths are empty, which is still worth a warning.
      - name: Upload coverage and runtime log
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage-system-${{ matrix.group }}
          include-hidden-files: true
          path: |
            coverage/
            tmp/parallel_runtime_rspec.log
          retention-days: 1

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: Playwright artifacts (group ${{ matrix.group }})
          path: |
            tmp/capybara/
          if-no-files-found: ignore

  coverage-report:
    runs-on: ubuntu-26.04
    needs: [unit-test, system-test]
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download coverage artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: coverage-parts

      - name: Set up Ruby
        uses: ruby/setup-ruby@145243922b4465b78e04dd66294782c7de45901f # v1.345.0
        with:
          bundler-cache: true

      - name: Merge coverage reports
        run: |
          mkdir -p coverage
          bundle exec rake coverage:merge

      - name: Upload coverage to Qlty
        uses: qltysh/qlty-action/coverage@56bee2d751c94b7bd8de22f64c9b5f398048e13f # v2.8.1
        with:
          token: ${{secrets.QLTY_COVERAGE_TOKEN}}
          files: coverage/.resultset.json

      # The runtime logs come with the coverage artifacts. Each glob finds
      # the logs of its own runs: the system specs and the unit specs.
      - name: Merge runtime logs
        run: |
          mkdir -p tmp
          cat coverage-parts/*/tmp/parallel_runtime_rspec.log | sort > tmp/parallel_runtime_rspec.log
          cat coverage-parts/*/tmp/parallel_runtime_unit.log | sort > tmp/parallel_runtime_unit.log

      - name: Save runtime log of the system specs to cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/parallel_runtime_rspec.log
          key: parallel-runtime-${{ github.sha }}

      - name: Save runtime log of the unit specs to cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/parallel_runtime_unit.log
          key: unit-runtime-${{ github.sha }}

      # Last, so that Qlty and the cache get their files also when the
      # coverage is too low
      - name: Check coverage
        run: bundle exec rake coverage:check

  ci-success:
    runs-on: ubuntu-26.04
    # coverage-report is not a gate. It uploads to Qlty and caches the
    # runtime log, and waiting for it only holds up publish.
    needs: [lint, unit-test, system-test, docker-build]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Check job results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Some jobs failed or were cancelled"
            exit 1
          fi

  docker-build:
    runs-on: ${{ matrix.runner }}
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-26.04
          - platform: linux/arm64
            runner: ubuntu-26.04-arm

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set platform pair
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set ENV values
        run: |
          echo "COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "COMMIT_TIME=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
          if [ -f VERSION_PREFIX ]; then
            git fetch origin main:main 2>/dev/null || true
            PREFIX=$(cat VERSION_PREFIX)
            COUNT=$(git rev-list --count main..HEAD)
            HASH=$(git rev-parse --short=7 HEAD)
            echo "COMMIT_VERSION=${PREFIX}-${COUNT}-g${HASH}" >> "$GITHUB_ENV"
          else
            echo "COMMIT_VERSION=$(git describe --always --abbrev=7)" >> "$GITHUB_ENV"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            maintainer=info@solectrus.de

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # The build record only feeds the job summary, which stays. Without
          # this the action also uploads it as a .dockerbuild artifact.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_SHA=${{ env.COMMIT_SHA }}
            COMMIT_TIME=${{ env.COMMIT_TIME }}
            COMMIT_VERSION=${{ env.COMMIT_VERSION }}
            COMMIT_BRANCH=${{ github.head_ref || github.ref_name }}
          # oci-mediatypes=true is required so the manifest list becomes an
          # OCI image index, which can carry annotations (set on the index in
          # the publish job). A Docker manifest list silently drops them.
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }},ignore-error=true
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      # What the Docker image must do and must refuse needs a container, so no
      # spec can cover it (see config/docker_image.rb). The build pushes by
      # digest and loads nothing, so it comes back from the registry. Each
      # runner pulls the platform it built.
      - name: Test the Docker image
        run: |
          image="ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
          docker pull "$image"
          bin/image-test.sh "$image"

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-26.04
    needs: [ci-success]
    # A push to develop, a "preview-*" branch or a release tag publishes the
    # image. A pull request or a "hotfix/*" branch builds and tests its image,
    # but no tag and no deployment.
    if: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/hotfix/') }}
    timeout-minutes: 10
    permissions:
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Attach annotations (incl. org.opencontainers.image.description,
          # taken from the GitHub repo description) to the image index, so
          # GHCR can show a package description.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          images=$(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
          # Read annotations into an array so values with spaces stay intact
          readarray -t annotations < <(jq -r '.annotations // [] | .[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # $tags and $images hold several arguments each and must split
          # shellcheck disable=SC2086
          docker buildx imagetools create "${annotations[@]/#/--annotation=}" $tags $images

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}

      - name: Send webhook to start deployment
        env:
          DEPLOY_HOOK: ${{ secrets.DEPLOY_HOOK }}
        if: env.DEPLOY_HOOK != null
        run: curl -sS -X POST "$DEPLOY_HOOK"

      - name: Notify Honeybadger about deployment
        env:
          DEPLOY_HOOK: ${{ secrets.DEPLOY_HOOK }}
          HONEYBADGER_API_KEY: ${{ secrets.HONEYBADGER_API_KEY }}
        if: env.DEPLOY_HOOK != null && env.HONEYBADGER_API_KEY != null
        uses: honeybadger-io/github-notify-deploy-action@aff9ff68c0b86ed19920a8fd8fe859f427ac051f # v2.0.0
        with:
          api_key: ${{ secrets.HONEYBADGER_API_KEY }}
