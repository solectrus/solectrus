name: Continuous integration

on:
  push:
    branches:
      - develop
      - next
    tags:
      - v*
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Lint with RuboCop
        run: bin/rubocop --parallel

      # Brakeman reads only this repository, so it belongs here. The gem and
      # package audits read an advisory database that changes on its own, and
      # a new advisory must not break a build that did not change. They run in
      # the nightly security-checks workflow instead.
      - name: Brakeman security scan
        run: bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error

      - name: Lint with ESLint
        run: bun run lint

      - name: Check for TypeScript errors
        run: bun run tsc

      - name: Lint with SlimLint
        run: bin/slim-lint .

      - name: Check formatting with Prettier
        run: bun run format:check

      - name: Check JS size limit
        run: |
          bunx vite build
          bun run size-limit

      - name: Shellcheck shell scripts
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

      # Checks the workflows themselves, and runs shellcheck on every
      # `run:` block in them.
      - name: Lint GitHub Actions workflows
        uses: raven-actions/actionlint@v2

  unit-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    services:
      influxdb:
        image: influxdb:2.9-alpine
        ports: ['8086:8086']
        env:
          INFLUXD_HTTP_BIND_ADDRESS: ':8086'
          DOCKER_INFLUXDB_INIT_MODE: setup
          DOCKER_INFLUXDB_INIT_USERNAME: my-user
          DOCKER_INFLUXDB_INIT_PASSWORD: my-password
          DOCKER_INFLUXDB_INIT_ORG: my-org
          DOCKER_INFLUXDB_INIT_BUCKET: my-bucket
          DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-token

      postgres:
        image: postgres:18-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_PASSWORD: postgres

    env:
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASSWORD: postgres
      RAILS_ENV: test
      DISABLE_SPRING: 1
      RUBY_YJIT_ENABLE: 1
      LANG: de_DE.UTF-8

      # The runner has four cores. Every worker boots Rails once before it
      # runs an example, so more workers than cores cost more than they
      # return. config/ci.rb holds the measurements behind the same limit
      # for bin/ci, which has run the unit specs this way all along.
      UNIT_WORKERS: 4

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      # One database per worker, numbered by TEST_ENV_NUMBER.
      # config/database.yml turns that number into the database name.
      - name: Setup PostgreSQL
        run: bin/rake "parallel:create[$UNIT_WORKERS]" "parallel:load_schema[$UNIT_WORKERS]"

      - name: Build Vite assets for test
        run: bunx vite build --mode test

      # No runtime log here: the unit specs split by file size, and
      # config/ci.rb says why that beats a split by runtime for them.
      - name: Run Unit tests with RSpec (${{ env.UNIT_WORKERS }} processes)
        run: |
          bundle exec parallel_rspec -n "$UNIT_WORKERS" \
            --serialize-stdout --combine-stderr \
            --exclude-pattern "spec/system/" \
            -o "--format progress" \
            spec
        env:
          SKIP_VITE_BUILD: 1
          COVERAGE_NAME: unit

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-unit
          include-hidden-files: true
          path: coverage/
          retention-days: 1

  system-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The one place that sets how many runners share the system specs.
        # The run step below takes the count from strategy.job-total.
        #
        # Six is the end of the line. parallel_tests never splits a single
        # file, and balance_navigation_battery_and_grid_spec.rb alone is 18%
        # of the suite, about 86 seconds here. A seventh runner would wait.
        group: [1, 2, 3, 4, 5, 6]

    services:
      influxdb:
        image: influxdb:2.9-alpine
        ports: ['8086:8086']
        env:
          INFLUXD_HTTP_BIND_ADDRESS: ':8086'
          DOCKER_INFLUXDB_INIT_MODE: setup
          DOCKER_INFLUXDB_INIT_USERNAME: my-user
          DOCKER_INFLUXDB_INIT_PASSWORD: my-password
          DOCKER_INFLUXDB_INIT_ORG: my-org
          DOCKER_INFLUXDB_INIT_BUCKET: my-bucket
          DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-token

      postgres:
        image: postgres:18-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_PASSWORD: postgres

    env:
      DB_HOST: localhost
      DB_USER: postgres
      DB_PASSWORD: postgres
      RAILS_ENV: test
      DISABLE_SPRING: 1
      RUBY_YJIT_ENABLE: 1
      LANG: de_DE.UTF-8
      # Save the page HTML next to the screenshot of a failed system test
      RAILS_SYSTEM_TESTING_SCREENSHOT_HTML: 1

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(bun -e "console.log(require('./node_modules/playwright/package.json').version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps --only-shell chromium

      - name: Restore runtime log
        uses: actions/cache/restore@v6
        with:
          path: tmp/parallel_runtime_rspec.log
          key: parallel-runtime-${{ github.sha }}
          restore-keys: |
            parallel-runtime-

      - name: Setup PostgreSQL
        run: bin/rails db:create db:schema:load

      - name: Build Vite assets for test
        run: bunx vite build --mode test

      - name: Run System tests with RSpec (group ${{ matrix.group }}/${{ strategy.job-total }})
        run: |
          if [ -s tmp/parallel_runtime_rspec.log ]; then
            GROUP_BY=runtime
          else
            GROUP_BY=filesize
          fi
          bundle exec parallel_test spec/system \
            --type rspec \
            --group-by $GROUP_BY \
            --runtime-log tmp/parallel_runtime_rspec.log \
            --only-group ${{ matrix.group }} \
            -n ${{ strategy.job-total }} \
            -o '--format progress --format ParallelTests::RSpec::RuntimeLogger --out tmp/parallel_runtime_rspec.log'
        env:
          SKIP_VITE_BUILD: 1
          COVERAGE_NAME: system-${{ matrix.group }}

      # Coverage and runtime log travel in one artifact. Two paths make the
      # repository root the archive root, so the files land under coverage/
      # and tmp/ inside it. if-no-files-found stays at the default: it only
      # fires when BOTH paths are empty, which is still worth a warning.
      - name: Upload coverage and runtime log
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-system-${{ matrix.group }}
          include-hidden-files: true
          path: |
            coverage/
            tmp/parallel_runtime_rspec.log
          retention-days: 1

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: Playwright artifacts (group ${{ matrix.group }})
          path: |
            tmp/capybara/
          if-no-files-found: ignore

  coverage-report:
    runs-on: ubuntu-24.04
    needs: [unit-test, system-test]
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage-parts

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Merge coverage reports
        run: |
          mkdir -p coverage
          bundle exec rake coverage:merge

      - name: Upload coverage to Qlty
        uses: qltysh/qlty-action/coverage@v2
        with:
          token: ${{secrets.QLTY_COVERAGE_TOKEN}}
          files: coverage/.resultset.json

      # The runtime logs come with the coverage artifacts. coverage-unit
      # holds no runtime log, and the glob passes it over.
      - name: Merge and cache runtime log
        run: |
          mkdir -p tmp
          cat coverage-parts/*/tmp/parallel_runtime_rspec.log | sort > tmp/parallel_runtime_rspec.log

      - name: Save runtime log to cache
        uses: actions/cache/save@v6
        with:
          path: tmp/parallel_runtime_rspec.log
          key: parallel-runtime-${{ github.sha }}

  ci-success:
    runs-on: ubuntu-24.04
    # coverage-report is not a gate. It uploads to Qlty and caches the
    # runtime log, and waiting for it only holds up publish.
    needs: [lint, unit-test, system-test, docker-build]
    if: always()
    timeout-minutes: 5
    steps:
      - name: Check job results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "Some jobs failed or were cancelled"
            exit 1
          fi

  docker-build:
    runs-on: ${{ matrix.runner }}
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set platform pair
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set ENV values
        run: |
          echo "COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "COMMIT_TIME=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
          if [ -f VERSION_PREFIX ]; then
            git fetch origin main:main 2>/dev/null || true
            PREFIX=$(cat VERSION_PREFIX)
            COUNT=$(git rev-list --count main..HEAD)
            HASH=$(git rev-parse --short=7 HEAD)
            echo "COMMIT_VERSION=${PREFIX}-${COUNT}-g${HASH}" >> "$GITHUB_ENV"
          else
            echo "COMMIT_VERSION=$(git describe --always --abbrev=7)" >> "$GITHUB_ENV"
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          labels: |
            maintainer=info@solectrus.de

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        env:
          # The build record only feeds the job summary, which stays. Without
          # this the action also uploads it as a .dockerbuild artifact.
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT_SHA=${{ env.COMMIT_SHA }}
            COMMIT_TIME=${{ env.COMMIT_TIME }}
            COMMIT_VERSION=${{ env.COMMIT_VERSION }}
            COMMIT_BRANCH=${{ github.head_ref || github.ref_name }}
          # oci-mediatypes=true is required so the manifest list becomes an
          # OCI image index, which can carry annotations (set on the index in
          # the publish job). A Docker manifest list silently drops them.
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }},ignore-error=true
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    runs-on: ubuntu-24.04
    needs: [ci-success]
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
    timeout-minutes: 10
    permissions:
      packages: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        env:
          # Attach annotations (incl. org.opencontainers.image.description,
          # taken from the GitHub repo description) to the image index, so
          # GHCR can show a package description.
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=raw,value=${{ github.head_ref }},enable=${{ github.event_name == 'pull_request' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          tags=$(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          images=$(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)
          # Read annotations into an array so values with spaces stay intact
          readarray -t annotations < <(jq -r '.annotations // [] | .[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          # $tags and $images hold several arguments each and must split
          # shellcheck disable=SC2086
          docker buildx imagetools create "${annotations[@]/#/--annotation=}" $tags $images

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}

      - name: Send webhook to start deployment
        env:
          DEPLOY_HOOK: ${{ secrets.DEPLOY_HOOK }}
        if: env.DEPLOY_HOOK != null
        run: curl -X POST ${{ env.DEPLOY_HOOK }}

      - name: Notify Honeybadger about deployment
        env:
          DEPLOY_HOOK: ${{ secrets.DEPLOY_HOOK }}
          HONEYBADGER_API_KEY: ${{ secrets.HONEYBADGER_API_KEY }}
        if: env.DEPLOY_HOOK != null && env.HONEYBADGER_API_KEY != null
        uses: honeybadger-io/github-notify-deploy-action@v1
        with:
          api_key: ${{ secrets.HONEYBADGER_API_KEY }}
