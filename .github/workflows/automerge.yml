name: Dependabot auto-merge
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-26.04
    # The author of the pull request, not the actor: the actor is whoever
    # triggered the run, and a pull request from a fork never qualifies
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: '${{ secrets.PAT }}'

      # The bun cooldown can pick a version that a newer release already
      # replaces. Such a pull request is closed, so Dependabot ignores that
      # version and opens a new pull request once the newer release is out of
      # the cooldown. Only releases in the same range count (same minor for a
      # patch, same major for a minor or a major). Bundler has no cooldown, so
      # there a newer release means a version constraint, and the pull request
      # would come back. The actions come as one weekly group, so an extra
      # update costs little.
      - name: Close an outdated PR or enable auto-merge
        shell: bash
        run: |
          outdated=""
          while IFS=$'\t' read -r name type version; do
            case "$type" in
              version-update:semver-patch) range="$(cut -d. -f1-2 <<<"$version")." ;;
              *) range="${version%%.*}." ;;
            esac

            latest=$(curl -fsSL --compressed -H 'Accept: application/vnd.npm.install-v1+json' \
              "https://registry.npmjs.org/${name/\//%2F}" |
              jq -r --arg range "$range" '.versions | keys[] | select(startswith($range) and (contains("-") | not))' |
              sort -V | tail -n 1)
            if [ "$latest" != "$version" ]; then
              outdated+="- \`$name\` $version: $latest is available"$'\n'
            fi
          done < <(jq -r '.[] | select(.packageEcosystem == "bun") | [.dependencyName, .updateType, .newVersion] | @tsv' <<<"$DEPENDENCIES")

          if [ -n "$outdated" ]; then
            gh pr close "$PR_URL" --comment "A newer release replaces this update:"$'\n\n'"$outdated"
          elif [ "$UPDATE_TYPE" != version-update:semver-major ]; then
            gh pr merge --auto --squash "$PR_URL"
          fi
        env:
          DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.PAT}}
