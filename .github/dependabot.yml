# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/configuring-dependabot-version-updates

version: 2
updates:
  - package-ecosystem: bundler
    directory: '/'
    schedule:
      interval: cron
      cronjob: '30 3 * * *'
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    versioning-strategy: lockfile-only
    cooldown:
      default-days: 3
    allow:
      - dependency-type: direct
      - dependency-type: indirect
    labels:
      - 'dependencies'
    groups:
      rails:
        patterns:
          - 'actioncable'
          - 'actionmailbox'
          - 'actionmailer'
          - 'actionpack'
          - 'actiontext'
          - 'actionview'
          - 'activejob'
          - 'activemodel'
          - 'activerecord'
          - 'activestorage'
          - 'activesupport'
          - 'rails'
          - 'railties'
          - 'turbo-rails'
          - 'stimulus-rails'
      rubocop:
        patterns:
          - 'rubocop'
          - 'rubocop-*'
      rspec:
        patterns:
          - 'rspec'
          - 'rspec-*'

  - package-ecosystem: bun
    directory: '/'
    schedule:
      interval: cron
      cronjob: '30 3 * * *'
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    versioning-strategy: auto
    cooldown:
      default-days: 3
    labels:
      - 'dependencies'
    ignore:
      # typescript-eslint does not support TypeScript 7 yet, stay on 6.x
      # (enforced by the "resolutions" entry in package.json)
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    groups:
      vite:
        patterns:
          - 'vite'
          - 'vite-plugin-rails'
      eslint:
        patterns:
          - 'eslint*'
      hotwired:
        patterns:
          - '@hotwired*'
      fortawesome:
        patterns:
          - '@fortawesome/*'
      size-limit:
        patterns:
          - '@size-limit/file'
          - 'size-limit'
      tailwindcss:
        patterns:
          - '@tailwindcss/*'
          - 'tailwindcss'
          - 'prettier-plugin-tailwindcss'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: cron
      cronjob: '30 3 * * *'
      timezone: Europe/Berlin
    cooldown:
      default-days: 3
    labels:
      - 'dependencies'
