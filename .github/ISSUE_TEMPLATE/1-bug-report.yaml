name: Fehlerbericht
description: Fehler in SOLECTRUS melden
type: Bug

body:
  - type: textarea
    id: description
    attributes:
      label: Beschreibung
      placeholder: Bitte unbedingt nur EIN Thema pro Issue, keine Sammlung von Problemen und Vorschlägen! Bei Screenshots bitte erläutern, worin genau der Fehler besteht.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Welche Version von SOLECTRUS verwendest du? Stelle unbedingt sicher, dass du die neueste Version nutzt, siehe https://github.com/solectrus/solectrus/releases, denn möglicherweise ist dein Problem bereits behoben.
      placeholder: z.B. v1.2.1
    validations:
      required: true

  - type: input
    id: machine
    attributes:
      label: Auf welchem Gerät läuft bei dir SOLECTRUS?
      placeholder: z.B. Raspberry Pi 4 mit Debian 12 (Bookworm)
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Logs & Konfiguration
      description: >-
        Am einfachsten mit **HELIOS**: Dort ein **Support-Paket** erstellen und
        die ZIP-Datei hier per Drag & Drop ablegen – sie enthält Logs und
        Konfiguration bereits anonymisiert.

        Ohne HELIOS: relevante Zeilen aus `docker compose logs` sowie deine
        `compose.yaml` und `.env` einfügen. Bitte alle sensiblen Daten
        unkenntlich machen (Passwörter, API-Schlüssel, Geodaten, etc.).
      placeholder: Support-Paket (ZIP) hier ablegen – oder Logs und Konfiguration einfügen …
