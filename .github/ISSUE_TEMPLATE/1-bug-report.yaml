name: Fehlerbericht
description: Fehler in SOLECTRUS melden
type: Bug

body:
  - type: textarea
    id: description
    attributes:
      label: Beschreibung
      description: Bitte nur ein Thema pro Issue, keine Sammlung von Problemen und Vorschlägen. Bei Screenshots schreib bitte dazu, worin genau der Fehler besteht.
      placeholder: Was passiert, und was hättest du stattdessen erwartet?
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Welche Version von SOLECTRUS verwendest du?
      description: Bitte prüfe vorher, ob du die [neueste Version](https://github.com/solectrus/solectrus/releases) nutzt – möglicherweise ist dein Problem dort schon behoben.
      placeholder: z.B. v1.3.0
    validations:
      required: true

  - type: input
    id: machine
    attributes:
      label: Auf welchem Gerät läuft bei dir SOLECTRUS?
      placeholder: z.B. Raspberry Pi 4 mit Debian 12 (Bookworm)
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Logs & Konfiguration
      description: |-
        **Ohne Logs und Konfiguration lässt sich ein Fehler oft nicht nachvollziehen.**

        Am einfachsten mit HELIOS: Es erstellt ein **Support-Paket** als ZIP-Datei mit `compose.yaml`, `.env`, Systeminfos und den letzten Logzeilen jedes Containers. **Passwörter, Tokens, Koordinaten und Hostnamen werden automatisch anonymisiert**, das Archiv kannst du also gefahrlos öffentlich anhängen. Du findest es in HELIOS im Menü oben rechts unter **Support**: Das ZIP herunterladen und hier per Drag & Drop ablegen.

        Ohne HELIOS: relevante Zeilen aus `docker compose logs` sowie deine `compose.yaml` und `.env` einfügen. Bitte alle sensiblen Daten unkenntlich machen (Passwörter, API-Schlüssel, Geodaten, etc.).

        Du nutzt HELIOS noch nicht? Ein Umstieg lohnt sich: [HELIOS](https://solectrus.de/install/) vereinfacht Installation, Konfiguration und Updates von SOLECTRUS erheblich – und liefert eben dieses Support-Paket auf Knopfdruck.
      placeholder: Support-Paket (ZIP) hier ablegen – oder Logs und Konfiguration einfügen …
    validations:
      required: false

  - type: checkboxes
    id: support-bundle
    attributes:
      label: Support-Paket angehängt
      options:
        - label: Ich habe ein Support-Paket (ZIP) angehängt – oder oben erklärt, warum das nicht geht.
          required: true
