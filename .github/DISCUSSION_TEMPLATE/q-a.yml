body:
  - type: markdown
    attributes:
      value: |
        ## Willkommen im Q&A

        Hier bist du richtig, wenn du eine Antwort suchst – ob Verständnisfrage, „Wie mache ich X?“ oder „Ist das so gedacht?“. Auch Probleme bei Installation und Konfiguration gehören hierher. Frag ruhig, auch wenn dir die Frage banal vorkommt.

        Nur wenn sich in SOLECTRUS etwas **ändern** soll, bist du woanders besser aufgehoben. Solche Anliegen gehören als Issue angelegt, denn nur Issues werden eingeplant und umgesetzt:

        - Etwas funktioniert nicht wie beschrieben → [Fehlerbericht](https://github.com/solectrus/solectrus/issues/new?template=1-bug-report.yaml)
        - Dir fehlt eine Funktion → [Anforderungsbeschreibung](https://github.com/solectrus/solectrus/issues/new?template=2-feature-request.yaml)

  - type: textarea
    id: question
    attributes:
      label: Deine Frage (auf Deutsch oder Englisch)
      description: Beschreibe, was du erreichen möchtest und woran es hakt. Screenshots sind willkommen – schreib bitte einen Satz dazu, worauf wir schauen sollen.
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Support-Paket oder Logs & Konfiguration
      description: |-
        Geht es um deine bestehende Installation? Dann erspart uns das hier viele Rückfragen.

        **Mit HELIOS:** Support-Paket erstellen (Menü oben rechts unter *Support*) und die ZIP-Datei hier ablegen. Sie enthält Konfiguration, Logs und Systeminfos – Passwörter und Schlüssel sind bereits geschwärzt.

        **Ohne HELIOS:** `compose.yaml`, `.env` und die passenden Zeilen aus `docker compose logs` einfügen. Sensible Daten bitte vorher unkenntlich machen.

        Noch kein HELIOS? Es macht Installation, Konfiguration und Updates deutlich einfacher und lässt sich jederzeit nachrüsten: [solectrus.de/install](https://solectrus.de/install/)
      placeholder: Support-Paket (ZIP) hier ablegen – oder Logs und Konfiguration einfügen …

  - type: checkboxes
    id: support-bundle
    attributes:
      label: Bestätigung
      options:
        - label: Ich habe ein Support-Paket oder meine Logs und Konfiguration angehängt – oder es geht nicht um meine bestehende Installation.
          required: true

  - type: input
    id: version
    attributes:
      label: Welche Version von SOLECTRUS verwendest du?
      description: Nur nötig, wenn du kein Support-Paket anhängen kannst.
      placeholder: z.B. v1.3.0

  - type: input
    id: machine
    attributes:
      label: Auf welchem Gerät läuft bei dir SOLECTRUS?
      description: Nur nötig, wenn du kein Support-Paket anhängen kannst.
      placeholder: z.B. Raspberry Pi 4 mit Debian 12 (Bookworm)
